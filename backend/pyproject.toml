[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "hridai-backend"
version = "0.1.0"
description = "HridAI heart sound screening API"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "python-multipart>=0.0.20,<1",
    "pydantic-settings>=2.7,<3",
    "numpy>=2.1,<3",
    "scipy>=1.14,<2",
    "onnxruntime>=1.20,<2",
]

[dependency-groups]
dev = [
    "httpx2",
    "imageio-ffmpeg>=0.6,<1",
    "pytest>=8.3,<9",
    "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q -m 'not cloud'"
markers = ["cloud: needs real Google Cloud access (opt-in)"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
